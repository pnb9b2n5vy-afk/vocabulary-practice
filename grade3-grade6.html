<title>姊弟單字練習</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d1d5db;--accent:#2563eb;--good:#15803d;--bad:#b91c1c;--soft:#eef4ff}

  <h1>📚 姊弟單字練習</h1>
  <div class="small">同一個網頁，兩個孩子各自練自己的程度。點自己的年級就可以開始。</div>
  <div class="home-grid">
    <button class="home-card g3" onclick="enterMode('g3')"><strong>小三練習</strong><span>練姊姊已經會的基礎字。<br>單字閃卡＋中文意思選擇題。</span></button>
    <button class="home-card g6" onclick="enterMode('g6')"><strong>小六練習</strong><span>練姊姊目前比較不熟的字。<br>句子閃卡＋例句選擇題填空。</span></button>
  </div>
</section>
<section id="app" class="hidden">
  <div class="topbar"><div><h2 id="modeTitle"></h2><div id="modeDesc" class="small"></div></div><button onclick="goHome()">← 換另一個孩子</button></div>

</section>
</div>

let mode=null, words=[], card=0, quiz=0, score=0, answered=false, known=new Set();
const $=id=>document.getElementById(id);
const tabs=[...document.querySelectorAll('.tab')], panels=[...document.querySelectorAll('.panel')];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function showTab(n){tabs.forEach(b=>b.classList.toggle('active',b.dataset.tab===n));panels.forEach(p=>p.classList.toggle('hidden',p.id!==n))}
function blankG6(item){const esc=item[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return item[1].replace(new RegExp('\\b'+esc+'\\b','ig'),'________')}
function enterMode(m){mode=m; words=m==='g3'?G3:G6; card=quiz=score=0; known=new Set(); $('score').textContent='0'; $('home').classList.add('hidden'); $('app').classList.remove('hidden'); if(m==='g3'){$('modeTitle').textContent='🌱 小三｜基礎單字';$('modeDesc').textContent='練姊姊已經打勾、比較熟的字。';$('listHint').textContent='看英文單字和中文意思。';$('quizHint').textContent='看英文單字，選出正確的中文意思。'}else{$('modeTitle').textContent='📘 小六｜不熟單字';$('modeDesc').textContent='練目前比較不熟的字。';$('listHint').textContent='看單字和例句，例句已依英文字母順序整理。';$('quizHint').textContent='看句子，選出最適合填入空格的單字。'} renderList(); renderCard(); renderQuiz(); showTab('list');}
function goHome(){$('app').classList.add('hidden');$('home').classList.remove('hidden')}
function renderList(){let h=''; words.forEach((it,i)=>{h+=`<div class="vocab-row"><div class="vocab-num">${i+1}</div><div class="vocab-word">${it[0]}</div><div class="vocab-extra">${it[1]}</div></div>`});$('vocabList').innerHTML=h}
function renderCard(){if(!words.length)return;const it=words[card];$('ci').textContent=card+1;$('ct').textContent=words.length;$('knownText').textContent='已認得 '+known.size+' 個';$('cm').classList.add('hidden');if(mode==='g3'){$('cw').textContent=it[0];$('cs').textContent='';$('cm').textContent=it[1]}else{$('cw').textContent='________';$('cs').textContent=blankG6(it);$('cm').textContent=''}}
function makeChoices(){const target=words[quiz][mode==='g3'?1:0];const idx=mode==='g3'?1:0;const pool=[...new Set(words.map(x=>x[idx]).filter(w=>w!==target))];shuffle(pool);return shuffle([target,...pool.slice(0,3)])}
function renderQuiz(){if(!words.length)return;answered=false;const it=words[quiz];$('qi').textContent=quiz+1;$('qmsg').textContent='';$('qmsg').className='status';$('qs').textContent=mode==='g3'?it[0]:blankG6(it);const box=$('choices');box.innerHTML='';makeChoices().forEach(v=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=v;b.onclick=()=>checkChoice(b,v);box.appendChild(b)})}
function checkChoice(btn,chosen){if(answered)return;answered=true;const target=words[quiz][mode==='g3'?1:0];[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===target)b.classList.add('correct')});if(chosen===target){score++;$('score').textContent=score;$('qmsg').textContent='✓ 答對了！';$('qmsg').className='status good'}else{btn.classList.add('wrong');$('qmsg').textContent='答案是：'+target;$('qmsg').className='status bad'}}
tabs.forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
$('reveal').onclick=()=>{const it=words[card];if(mode==='g3'){$('cm').classList.remove('hidden')}else{$('cw').textContent=it[0];$('cs').textContent=it[1]}};
$('prev').onclick=()=>{card=(card-1+words.length)%words.length;renderCard()};
$('next').onclick=()=>{card=(card+1)%words.length;renderCard()};
$('known').onclick=()=>{known.add(card);card=(card+1)%words.length;renderCard()};
$('hard').onclick=()=>{known.delete(card);card=(card+1)%words.length;renderCard()};
$('show').onclick=()=>{const target=words[quiz][mode==='g3'?1:0];answered=true;[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===target)b.classList.add('correct')});$('qmsg').textContent='答案：'+target;$('qmsg').className='status'};
$('qnext').onclick=()=>{quiz=(quiz+1)%words.length;renderQuiz()};
</script>
