<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="單字練習">
<title>1200字不熟單字練習</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d1d5db;--accent:#2563eb;--good:#15803d;--bad:#b91c1c}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:800px;margin:auto;padding:16px} h1{font-size:24px;margin:5px 0} .small{font-size:14px;color:var(--muted);line-height:1.5}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0} button{min-height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;padding:10px 14px;color:var(--text)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.active{background:#dbeafe;border-color:#93c5fd}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:12px}
textarea,input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;background:#fff} textarea{min-height:280px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px} .center{text-align:center} .word{font-size:34px;font-weight:700;margin:20px 0 10px} .sentence{font-size:20px;line-height:1.8}
.hidden{display:none} .status{margin-top:10px;font-size:14px;color:var(--muted)} .good{color:var(--good);font-weight:700} .bad{color:var(--bad);font-weight:700}
.pill{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:999px;margin:3px;font-size:14px}
.vocab-list{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.vocab-head,.vocab-row{display:grid;grid-template-columns:52px minmax(120px,180px) 1fr;align-items:start}
.vocab-head{background:#f3f4f6;font-weight:700;font-size:14px;color:#4b5563}
.vocab-row{border-top:1px solid #e5e7eb}
.vocab-head>div,.vocab-row>div{padding:11px 12px}
.vocab-num{color:var(--muted);text-align:center}
.vocab-word{font-weight:700;font-size:17px;word-break:break-word}
.vocab-sentence{line-height:1.55;font-size:16px}
.edit-toggle{margin-top:12px}
#editorWrap{margin-top:12px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.choice{min-height:58px;font-size:18px;text-align:left;padding:12px 14px}.choice.correct{border-color:var(--good);background:#dcfce7}.choice.wrong{border-color:var(--bad);background:#fee2e2}.choice:disabled{opacity:1;color:var(--text)}
@media(max-width:520px){.tabs{grid-template-columns:1fr}.word{font-size:30px}.sentence{font-size:19px}.choices{grid-template-columns:1fr}.vocab-head{display:none}.vocab-row{display:grid;grid-template-columns:38px 1fr}.vocab-row>div{padding:10px}.vocab-sentence{grid-column:2;font-size:15px;padding-top:0!important}.vocab-word{font-size:17px}.vocab-num{grid-row:1 / span 2}}
</style>
</head>
<body>
<div class="wrap">
<h1>1200字｜不熟單字練習</h1>
<div class="small">這是依照片中「△ 或沒有明確 ✓」做的第一輪名單。你可以在「編輯名單」刪掉其實已經會的字；修改後會保存在這台裝置。</div>
<div class="tabs">
<button class="tab active" data-tab="edit">編輯名單</button>
<button class="tab" data-tab="cards">句子閃卡</button>
<button class="tab" data-tab="quiz">選擇題填空</button>
</div>

<section id="edit" class="panel">
<div class="card">
<div class="small">已按英文字母順序整理。手機上會顯示成「單字在上、例句在下」，比較好閱讀。</div>
<div id="vocabList" class="vocab-list"></div>
<button id="toggleEdit" class="edit-toggle">編輯名單</button>
<div id="editorWrap" class="hidden">
  <div class="small" style="margin-top:10px">格式：單字 | 英文例句（每行一組）</div>
  <textarea id="editor"></textarea>
  <div class="row"><button id="save" class="primary">儲存名單</button><button id="reset">回復原始名單</button></div>
</div>
<div id="editMsg" class="status"></div>
</div>
</section>

<section id="cards" class="panel hidden">
<div class="card center">
<div class="small"><span id="ci">1</span> / <span id="ct">1</span>　<span id="knownText"></span></div>
<div id="cw" class="word">________</div>
<div id="cs" class="sentence"></div>
<button id="reveal" style="margin-top:16px">顯示答案</button>
<div class="row" style="justify-content:center">
<button id="prev">上一張</button><button id="hard">還不熟</button><button id="known" class="primary">認得了</button><button id="next">下一張</button>
</div>
</div>
</section>

<section id="quiz" class="panel hidden">
<div class="card">
<div class="small">第 <span id="qi">1</span> 題　｜　答對 <span id="score">0</span> 題</div>
<div class="small" style="margin-top:8px">看句子，選出最適合填入空格的單字。</div>
<div id="qs" class="sentence" style="margin-top:18px"></div>
<div id="choices" class="choices"></div>
<div class="row"><button type="button" id="show">看答案</button><button type="button" id="qnext" class="primary">下一題</button></div>
<div id="qmsg" class="status"></div>
</div>
</section>
</div>

function serial(a){return a.map(x=>x[0]+' | '+x[1]).join('\n')}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeChoices(){
  const target=words[quiz][0];
  const pool=[...new Set(words.map(x=>x[0]).filter(w=>w.toLowerCase()!==target.toLowerCase()))];
  shuffle(pool);
  return shuffle([target,...pool.slice(0,3)]);
}

  $('qi').textContent=quiz+1;
  $('qs').textContent=blank(it);
  $('qmsg').textContent='';$('qmsg').className='status';
  const box=$('choices');box.innerHTML='';
  makeChoices().forEach(w=>{
    const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=w;
    b.addEventListener('click',()=>checkChoice(b,w));box.appendChild(b);
  });
}
function checkChoice(btn,chosen){
  if(answered)return;answered=true;
  const target=words[quiz][0];
  [...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent.toLowerCase()===target.toLowerCase())b.classList.add('correct')});
  if(chosen.toLowerCase()===target.toLowerCase()){score++;$('score').textContent=score;$('qmsg').textContent='✓ 答對了！';$('qmsg').className='status good'}
  else{btn.classList.add('wrong');$('qmsg').textContent='答案是：'+target;$('qmsg').className='status bad'}
}
tabs.forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
$('save').addEventListener('click',save);
$('reset').addEventListener('click',()=>{words=sortWords(BASE);localStorage.removeItem('vocab1200');$('editor').value=serial(words);card=quiz=score=0;known=new Set();renderVocabList();renderCard();renderQuiz();$('editMsg').textContent='已回復原始名單。'});
$('toggleEdit').addEventListener('click',()=>{const w=$('editorWrap');const isHidden=w.classList.toggle('hidden');$('toggleEdit').textContent=isHidden?'編輯名單':'收起編輯';});
$('reveal').addEventListener('click',()=>{const it=words[card];$('cw').textContent=it[0];$('cs').textContent=it[1]});
$('prev').addEventListener('click',()=>{card=(card-1+words.length)%words.length;renderCard()});
$('next').addEventListener('click',()=>{card=(card+1)%words.length;renderCard()});
$('known').addEventListener('click',()=>{known.add(card);card=(card+1)%words.length;renderCard()});
$('hard').addEventListener('click',()=>{known.delete(card);card=(card+1)%words.length;renderCard()});
$('show').addEventListener('click',()=>{const target=words[quiz][0];answered=true;[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent.toLowerCase()===target.toLowerCase())b.classList.add('correct')});$('qmsg').textContent='答案：'+target;$('qmsg').className='status'});
$('qnext').addEventListener('click',()=>{quiz=(quiz+1)%words.length;renderQuiz()});
load();
})();
</script>
</body>
</html>
