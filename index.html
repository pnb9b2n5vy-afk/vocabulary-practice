<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>姊弟單字練習</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d1d5db;--accent:#2563eb;--good:#15803d;--bad:#b91c1c;--soft:#eef4ff}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:860px;margin:auto;padding:16px} h1{font-size:25px;margin:6px 0} h2{font-size:21px;margin:4px 0 10px} .small{font-size:14px;color:var(--muted);line-height:1.55}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px} .home-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;text-align:left;min-height:155px}
.home-card strong{display:block;font-size:24px;margin-bottom:8px} .home-card span{font-size:15px;color:var(--muted);line-height:1.55} .home-card.g3{border-top:6px solid #10b981} .home-card.g6{border-top:6px solid #2563eb}
.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap} button{min-height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;padding:10px 14px;color:var(--text)} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button.goodbtn{background:#ecfdf5;border-color:#a7f3d0} button.active{background:#dbeafe;border-color:#93c5fd}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0} .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:12px} .center{text-align:center} .word{font-size:38px;font-weight:750;margin:22px 0 12px} .meaning{font-size:24px;line-height:1.6;margin:16px 0} .sentence{font-size:20px;line-height:1.8}
.hidden{display:none!important} .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px} .status{margin-top:10px;font-size:14px;color:var(--muted)} .good{color:var(--good);font-weight:700} .bad{color:var(--bad);font-weight:700}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px} .choice{min-height:60px;font-size:18px;text-align:left;padding:12px 14px} .choice.correct{border-color:var(--good);background:#dcfce7} .choice.wrong{border-color:var(--bad);background:#fee2e2} .choice:disabled{opacity:1;color:var(--text)}
.vocab-list{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff} .vocab-row{display:grid;grid-template-columns:54px minmax(130px,190px) 1fr;border-top:1px solid #e5e7eb;align-items:start} .vocab-row:first-child{border-top:0} .vocab-row>div{padding:10px 12px} .vocab-num{color:var(--muted);text-align:center} .vocab-word{font-weight:700;font-size:17px} .vocab-extra{line-height:1.55;font-size:16px}
.badge{display:inline-block;background:var(--soft);border-radius:999px;padding:5px 9px;font-size:13px;margin-left:6px}
.word-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.mini-tool{min-height:34px;padding:5px 9px;font-size:14px;border-radius:9px}.card-tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:560px){.home-grid{grid-template-columns:1fr} .tabs{grid-template-columns:1fr 1fr 1fr} .word{font-size:34px} .sentence{font-size:19px} .choices{grid-template-columns:1fr} .vocab-row{grid-template-columns:38px 1fr} .vocab-extra{grid-column:2;padding-top:0!important;font-size:15px} .vocab-num{grid-row:1 / span 2} .home-card{min-height:130px}}

.result-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.score-big{font-size:38px;font-weight:800;text-align:center;margin:8px 0}
.score-sub{text-align:center;color:var(--muted);margin-bottom:14px}
.review-item{border-top:1px solid #e5e7eb;padding:14px 0}
.review-item:first-child{border-top:0}
.review-word{font-size:21px;font-weight:800}
.review-sentence{font-size:17px;line-height:1.65;margin-top:6px}
.review-meta{font-size:14px;line-height:1.6;color:var(--muted);margin-top:6px}
.mastery{display:inline-block;padding:3px 8px;border-radius:999px;background:#ecfdf5;color:#166534;font-size:12px;font-weight:700;margin-left:6px}
.after-answer{margin-top:12px;padding:12px;border-radius:12px;background:#f8fafc;border:1px solid #e5e7eb}
.after-answer .full-sentence{font-size:17px;line-height:1.65}

.wordlist-tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.wordlist-tools input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px}
.translation-btn{margin-top:8px}
.jump-btn{margin-top:8px}

.source-chooser{margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:#f8fafc}
.source-buttons{display:flex;gap:8px;flex-wrap:wrap}
.source-btn{flex:1;min-width:150px}
.source-btn.active{background:#dbeafe;border-color:#93c5fd}
.date-filter{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.date-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.date-row label{font-size:14px;color:var(--muted)}
.date-row input{display:block;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:15px;background:#fff}
.date-tag{display:inline-block;margin-top:6px;padding:2px 7px;border-radius:999px;background:#eef2ff;color:#475569;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<section id="home">
  <h1>📚 姊弟單字練習</h1>
  <div class="small">同一個網頁，兩個孩子各自練自己的程度。點自己的年級就可以開始。</div>
  <div class="home-grid">
    <button class="home-card g3" onclick="enterMode('g3')"><strong>小三練習</strong><span>練姊姊已經會的基礎字。<br>有線索例句＋閃卡＋選擇題填空＋錯題複習。</span></button>
    <button class="home-card g6" onclick="enterMode('g6')"><strong>小六練習</strong><span>練姊姊目前比較不熟的字。<br>句子閃卡＋例句選擇題填空。</span></button>
  </div>
</section>
<section id="app" class="hidden">
  <div class="topbar"><div><h2 id="modeTitle"></h2><div id="modeDesc" class="small"></div>
<div id="sourceChooser" class="source-chooser hidden">
  <div class="small" style="margin-bottom:8px">選擇單字來源</div>
  <div class="source-buttons">
    <button id="src1200" class="source-btn active">國小1200字</button>
    <button id="srcLTIEAug" class="source-btn">大家說英語｜2026年8月</button>
    <button id="srcCombined" class="source-btn">全部一起練</button>
  </div>
  <div id="dateFilterBox" class="date-filter hidden">
    <div class="small" style="margin-bottom:6px">大家說英語日期範圍</div>
    <div class="date-row">
      <label>從 <input id="ltieDateStart" type="date" value="2026-08-04" min="2026-08-04" max="2026-08-31"></label>
      <label>到 <input id="ltieDateEnd" type="date" value="2026-08-31" min="2026-08-04" max="2026-08-31"></label>
      <button id="applyDateRange" class="primary">套用日期</button>
    </div>
  </div>
  <div id="sourceNote" class="small" style="margin-top:8px"></div>
</div>
</div><button onclick="goHome()">← 換另一個孩子</button></div>
  <div class="tabs"><button class="tab active" data-tab="list">單字表</button><button class="tab" data-tab="cards">閃卡</button><button class="tab" data-tab="quiz">選擇題</button><button class="tab" data-tab="history">錯題紀錄</button><button class="tab" data-tab="results">本輪結果</button></div>
  <section id="list" class="panel"><div class="card"><div id="listHint" class="small"></div>
        <div class="wordlist-tools">
          <input id="wordSearch" type="search" placeholder="搜尋單字">
        </div><div id="vocabList" class="vocab-list"></div></div></section>
  <section id="cards" class="panel hidden">
    <div class="card">
      <div class="range-box">
        <strong>閃卡範圍</strong>
        <div class="range-row">
          <div class="range-field"><label>從第幾個字</label><input id="cardStart" type="number" min="1" value="1"></div>
          <div class="range-field"><label>到第幾個字</label><input id="cardEnd" type="number" min="1" value="50"></div>
          <div class="range-field"><label>這輪要做幾題</label><input id="cardCount" type="number" min="1" value="20"></div>
          <button id="cardRandomize" class="primary">🎲 隨機開始</button>
        </div>
        <div id="cardRangeNote" class="range-note">會在你選的範圍內隨機抽出指定題數，而且一輪內不重複。</div>
      </div>
      <div class="center">
        <div class="small"><span id="ci">1</span> / <span id="ct">1</span>　<span id="knownText"></span></div>
        <div id="cw" class="word"></div>
        <div id="cs" class="sentence"></div>
        <div id="cm" class="meaning hidden"></div>
        <div id="cardTools" class="card-tools hidden"><button class="mini-tool" onclick="speakCurrentCard()">🔊 發音</button><button class="mini-tool" onclick="lookupCurrentCard()">🔎 查翻譯</button></div>
        <button id="reveal" style="margin-top:16px">顯示答案</button>
        <div class="row" style="justify-content:center"><button id="prev">上一張</button><button id="hard">還不熟</button><button id="known" class="primary">認得了</button><button id="next">下一張</button></div>
      </div>
    </div>
  </section>
  <section id="quiz" class="panel hidden">
    <div class="card">
      <div class="range-box">
        <strong>選擇題範圍</strong>
        <div class="range-row">
          <div class="range-field"><label>從第幾個字</label><input id="quizStart" type="number" min="1" value="1"></div>
          <div class="range-field"><label>到第幾個字</label><input id="quizEnd" type="number" min="1" value="50"></div>
          <div class="range-field"><label>這輪要做幾題</label><input id="quizCount" type="number" min="1" value="20"></div>
          <button id="quizRandomize" class="primary">🎲 隨機開始</button>
        </div>
        <div id="quizRangeNote" class="range-note">會在你選的範圍內隨機抽出指定題數，而且一輪內不重複。</div>
      </div>
      <div class="small">第 <span id="qi">1</span> 題　｜　答對 <span id="score">0</span> 題</div>
      <div id="quizHint" class="small" style="margin-top:8px"></div>
      <div id="qs" class="sentence" style="margin-top:18px"></div>
      <div id="choices" class="choices"></div>
      <div class="row"><button id="show">看答案</button><button id="qnext" class="primary">下一題</button></div>
      <div id="afterAnswer" class="after-answer hidden">
        <div class="small">完整例句</div>
        <div id="fullSentence" class="full-sentence"></div>
        <div class="row">
          <button id="speakWordBtn" class="mini-tool">🔊 單字</button>
          <button id="speakSentenceBtn" class="mini-tool">🔊 例句</button><button id="translateSentenceBtn" class="mini-tool">中文翻譯</button>
        </div>
      </div>
      <div id="qmsg" class="status"></div>
    </div>
  </section>

  <section id="history" class="panel hidden">
    <div class="result-card">
      <h3 style="margin-top:0">📌 錯題紀錄</h3>
      <div class="small">紀錄會保存在目前這台裝置的瀏覽器裡。</div>
      <div id="currentWrongInfo" class="status" style="margin-top:10px">這一輪目前沒有錯題。</div>
      <div class="row">
        <button id="retryCurrentWrong" class="primary" disabled>只練這次錯題</button>
        <button id="clearHistory">清除累積紀錄</button>
      </div>
    </div>

    <div class="result-card">
      <h3 style="margin-top:0">累積需要加強</h3>
      <div class="small">錯得越多的字排越前面；連續答對 3 次會標記「比較熟」。</div>
      <div id="historyReviewLive"><div class="small">目前還沒有錯題紀錄。</div></div>
    </div>
  </section>

  <section id="results" class="panel hidden">
    <div class="result-card">
      <h3 style="margin-top:0">📊 本輪結果</h3>
      <div id="resultPlaceholder" class="small">完成這一輪測驗後，這裡會顯示成績和本輪錯題。</div>
      <div id="resultBody" class="hidden">
        <div id="finalScore" class="score-big">0 / 0</div>
        <div id="finalRate" class="score-sub"></div>
        <div class="row" style="justify-content:center">
          <button id="retryWrong" class="primary">只練這次錯題</button>
          <button id="newRound">重新設定範圍</button>
        </div>
      </div>
    </div>

    <div id="wrongResultCard" class="result-card hidden">
      <h3 style="margin-top:0">這次答錯的題目</h3>
      <div id="wrongReview"></div>
    </div>

    <div id="historyResultCard" class="result-card hidden">
      <h3 style="margin-top:0">累積需要加強</h3>
      <div id="historyReview"></div>
    </div>
  </section>

</section>
</div>

}

function enterMode(m){
  mode=m; source='1200'; words=m==='g3'?G3:G6.map(x=>[x[0],x[1],null]); if($('wordSearch'))$('wordSearch').value=''; card=quiz=score=0; known=new Set(); cardOrder=[];quizOrder=[];cardPos=quizPos=0;
  $('score').textContent='0'; $('home').classList.add('hidden'); $('app').classList.remove('hidden');
  const defaultEnd=Math.min(50,words.length);
  ['cardStart','quizStart'].forEach(id=>{$(id).min=1;$(id).max=words.length;$(id).value=1});
  ['cardEnd','quizEnd'].forEach(id=>{$(id).min=1;$(id).max=words.length;$(id).value=defaultEnd});
  ['cardCount','quizCount'].forEach(id=>{$(id).min=1;$(id).max=defaultEnd;$(id).value=Math.min(20,defaultEnd)});
  if(m==='g3'){
    $('modeTitle').textContent='🌱 小三｜基礎單字';$('sourceChooser').classList.add('hidden');
    $('modeDesc').textContent='練姊姊已經打勾、比較熟的字。';
    $('listHint').textContent='看英文單字、中文意思和簡單例句。';
    $('quizHint').textContent='看例句，選出最適合填入空格的英文單字。'
  }else{
    $('modeTitle').textContent='📘 小六｜不熟單字';$('sourceChooser').classList.remove('hidden');$('dateFilterBox').classList.add('hidden');
    $('modeDesc').textContent='練目前比較不熟的字。';
    $('listHint').textContent='看單字和例句，例句已依英文字母順序整理。';
    $('quizHint').textContent='看句子，選出最適合填入空格的單字。';$('sourceNote').textContent=`國小1200字目前不熟名單｜共 ${words.length} 個`
  }
  renderList();
  cardOrder=[]; quizOrder=[]; cardPos=quizPos=0; roundActive=false;
  $('cardRangeNote').textContent='請先設定範圍與題數，再按「🎲 隨機開始」。';
  $('quizRangeNote').textContent='請先設定範圍與題數，再按「🎲 隨機開始」。';
  $('ci').textContent='0'; $('ct').textContent='0';
  $('cw').textContent=''; $('cs').textContent=''; $('cm').classList.add('hidden'); $('cardTools').classList.add('hidden');
  $('qi').textContent='0'; $('qs').textContent=''; $('choices').innerHTML=''; $('qmsg').textContent='';
  renderHistory(); showTab('list');
}
function goHome(){$('app').classList.add('hidden');$('home').classList.remove('hidden')}
function renderList(){
  const q=($('wordSearch')?.value||'').trim().toLowerCase();
  let h='',shown=0;
  words.forEach((it,i)=>{
    const w=it[0], sentence=wordSentence(it);
    if(q && !w.toLowerCase().includes(q))return;
    shown++;
    const ew=encodeURIComponent(w), es=encodeURIComponent(sentence);
    const extra=mode==='g3'
      ? `<div><strong>${it[1]}</strong></div><div style="margin-top:5px">${sentence}</div>`
      : `<div>${sentence}</div>${it[2]?`<span class="date-tag">大家說英語 ${it[2].slice(5)}</span>`:''}`;
    h+=`<div class="vocab-row">
      <div class="vocab-num">${i+1}</div>
      <div class="vocab-word">${w}
        <div class="word-tools">
          <button class="mini-tool" data-word="${ew}" onclick="speakEncoded(this.dataset.word)">🔊 發音</button>
          <button class="mini-tool" data-word="${ew}" onclick="lookupEncoded(this.dataset.word)">🔎 查單字</button>
        </div>
      </div>
      <div class="vocab-extra">${extra}
        <div><button class="mini-tool translation-btn" data-sentence="${es}" onclick="openTranslation(decodeURIComponent(this.dataset.sentence))">中文翻譯</button></div>
      </div>
    </div>`
  });
  $('vocabList').innerHTML=shown?h:'<div class="small" style="padding:16px">沒有符合的單字。</div>'
}
function renderCard(){
  if(!words.length)return;
  if(!cardOrder.length)cardOrder=makeOrder('cardStart','cardEnd','cardCount');
  card= currentCardIndex();
  const it=words[card];
  $('ci').textContent=cardPos+1; $('ct').textContent=cardOrder.length;
  $('knownText').textContent='已認得 '+known.size+' 個';
  $('cm').classList.add('hidden'); $('cw').textContent='________';
  $('cs').textContent=mode==='g3'?blankG3(it):blankG6(it);
  $('cm').textContent=mode==='g3'?it[1]:'';
  $('cardTools').classList.add('hidden')
}
function makeChoices(){
  const qidx=currentQuizIndex(), target=words[qidx][0];
  const source=quizOrder.length?quizOrder.map(i=>words[i][0]):words.map(x=>x[0]);
  let pool=[...new Set(source.filter(w=>w!==target))];
  if(pool.length<3) pool=[...new Set(words.map(x=>x[0]).filter(w=>w!==target))];
  shuffle(pool); return shuffle([target,...pool.slice(0,3)])
}
function renderQuiz(){
  if(!words.length)return;
  if(!quizOrder.length)quizOrder=makeOrder('quizStart','quizEnd','quizCount');
  answered=false; quiz=currentQuizIndex(); const it=words[quiz];
  $('qi').textContent=quizPos+1; $('qmsg').textContent=''; $('qmsg').className='status'; $('afterAnswer').classList.add('hidden'); $('qnext').textContent=(quizPos===quizOrder.length-1?'查看本輪結果':'下一題');
  $('qs').textContent=mode==='g3'?blankG3(it):blankG6(it);
  const box=$('choices'); box.innerHTML='';
  makeChoices().forEach(v=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=v;b.onclick=()=>checkChoice(b,v);box.appendChild(b)})
}
function checkChoice(btn,chosen){
  if(answered)return;answered=true;
  const idx=currentQuizIndex(), it=words[idx], target=it[0], ok=chosen===target;
  [...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===target)b.classList.add('correct')});
  if(ok){
    score++;$('score').textContent=score;$('qmsg').textContent='✓ 答對了！';$('qmsg').className='status good'
  }else{
    btn.classList.add('wrong');$('qmsg').textContent='再看一次完整例句，找出線索。';$('qmsg').className='status bad';
    roundWrong.push({index:idx,chosen})
  }
  roundAnswers.push({index:idx,chosen,correct:ok});
  updateStats(target,ok); renderHistory();
  $('fullSentence').textContent=wordSentence(it);
  $('afterAnswer').classList.remove('hidden')
}
tabs.forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
$('reveal').onclick=()=>{const it=words[currentCardIndex()];$('cw').textContent=it[0];$('cs').textContent=mode==='g3'?it[2]:it[1];if(mode==='g3')$('cm').classList.remove('hidden');$('cardTools').classList.remove('hidden')};
$('prev').onclick=()=>{if(!cardOrder.length)return;cardPos=(cardPos-1+cardOrder.length)%cardOrder.length;renderCard()};
$('next').onclick=()=>{if(!cardOrder.length)return;cardPos=(cardPos+1)%cardOrder.length;renderCard()};
$('known').onclick=()=>{known.add(currentCardIndex());if(cardOrder.length)cardPos=(cardPos+1)%cardOrder.length;renderCard()};
$('hard').onclick=()=>{known.delete(currentCardIndex());if(cardOrder.length)cardPos=(cardPos+1)%cardOrder.length;renderCard()};
$('show').onclick=()=>{
  if(answered)return;
  const idx=currentQuizIndex(),it=words[idx],target=it[0];answered=true;
  [...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===target)b.classList.add('correct')});
  roundWrong.push({index:idx,chosen:'看答案'});roundAnswers.push({index:idx,chosen:'看答案',correct:false});updateStats(target,false);renderHistory();
  $('qmsg').textContent='答案：'+target;$('qmsg').className='status bad';
  $('fullSentence').textContent=wordSentence(it);$('afterAnswer').classList.remove('hidden')
};
$('qnext').onclick=()=>{
  if(!answered){$('qmsg').textContent='請先作答或按「看答案」。';return}
  if(!quizOrder.length)return;
  if(quizPos>=quizOrder.length-1){finishRound();return}
  quizPos++;renderQuiz()
};
$('speakWordBtn').onclick=()=>{if(words.length)speakWord(words[currentQuizIndex()][0])};
$('speakSentenceBtn').onclick=()=>{if(words.length)speakSentence(wordSentence(words[currentQuizIndex()]))};
$('translateSentenceBtn').onclick=()=>{if(words.length)openTranslation(wordSentence(words[currentQuizIndex()]))};
$('retryWrong').onclick=startWrongRound;
$('retryCurrentWrong').onclick=startWrongRound;
$('clearHistory').onclick=()=>{if(confirm('要清除這個孩子在這台裝置上的所有累積錯題紀錄嗎？')){localStorage.removeItem(statsKey());renderHistory()}};
$('newRound').onclick=()=>{showTab('quiz');$('quizRangeNote').textContent='重新設定範圍後，按「🎲 隨機開始」。'};
if($('wordSearch'))$('wordSearch').addEventListener('input',renderList);
['quizStart','quizEnd','quizCount'].forEach(id=>$(id).addEventListener('input',markQuizSettingsChanged));
['cardStart','cardEnd','cardCount'].forEach(id=>$(id).addEventListener('input',markCardSettingsChanged));
$('src1200').onclick=()=>setSource('1200');
$('srcLTIEAug').onclick=()=>setSource('ltie');
$('srcCombined').onclick=()=>setSource('combined');
$('applyDateRange').onclick=()=>resetForSource();
$('ltieDateStart').addEventListener('change',()=>{$('sourceNote').textContent='日期已變更，按「套用日期」後更新單字。'});
$('ltieDateEnd').addEventListener('change',()=>{$('sourceNote').textContent='日期已變更，按「套用日期」後更新單字。'});
$('cardRandomize').onclick=startCardRandom;
$('quizRandomize').onclick=startQuizRandom;
</script>
</body></html>
