let mode=null, words=[], card=0, quiz=0, score=0, answered=false, known=new Set();
const $=id=>document.getElementById(id);
const tabs=[...document.querySelectorAll('.tab')], panels=[...document.querySelectorAll('.panel')];

function speakWord(word){
  if(!('speechSynthesis' in window)){alert('這台裝置目前無法使用網頁發音。');return}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=0.82;window.speechSynthesis.speak(u)
}
function lookupWord(word){
  const url='https://translate.google.com/?sl=en&tl=zh-TW&text='+encodeURIComponent(word)+'&op=translate';
  window.open(url,'_blank','noopener')
}
function speakEncoded(v){speakWord(decodeURIComponent(v))}
function lookupEncoded(v){lookupWord(decodeURIComponent(v))}
function speakCurrentCard(){if(words.length)speakWord(words[card][0])}
function lookupCurrentCard(){if(words.length)lookupWord(words[card][0])}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function showTab(n){tabs.forEach(b=>b.classList.toggle('active',b.dataset.tab===n));panels.forEach(p=>p.classList.toggle('hidden',p.id!==n))}
function blankG6(item){const esc=item[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return item[1].replace(new RegExp('\\b'+esc+'\\b','ig'),'________')}
function blankG3(item){const esc=item[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return item[2].replace(new RegExp('\\b'+esc+'\\b','ig'),'________')}
function enterMode(m){mode=m; words=m==='g3'?G3:G6; card=quiz=score=0; known=new Set(); $('score').textContent='0'; $('home').classList.add('hidden'); $('app').classList.remove('hidden'); if(m==='g3'){$('modeTitle').textContent='🌱 小三｜基礎單字';$('modeDesc').textContent='練姊姊已經打勾、比較熟的字。';$('listHint').textContent='看英文單字和中文意思。';$('quizHint').textContent='看英文單字，選出正確的中文意思。'}else{$('modeTitle').textContent='📘 小六｜不熟單字';$('modeDesc').textContent='練目前比較不熟的字。';$('listHint').textContent='看單字和例句，例句已依英文字母順序整理。';$('quizHint').textContent='看句子，選出最適合填入空格的單字。'} renderList(); renderCard(); renderQuiz(); showTab('list');}
function goHome(){$('app').classList.add('hidden');$('home').classList.remove('hidden')}
function renderList(){let h=''; words.forEach((it,i)=>{const ew=encodeURIComponent(it[0]);const extra=mode==='g3'?`<div><strong>${it[1]}</strong></div><div style="margin-top:5px">${it[2]}</div>`:it[1];h+=`<div class="vocab-row"><div class="vocab-num">${i+1}</div><div class="vocab-word">${it[0]}<div class="word-tools"><button class="mini-tool" data-word="${ew}" onclick="speakEncoded(this.dataset.word)">🔊 發音</button><button class="mini-tool" data-word="${ew}" onclick="lookupEncoded(this.dataset.word)">🔎 查翻譯</button></div></div><div class="vocab-extra">${extra}</div></div>`});$('vocabList').innerHTML=h}
function renderCard(){if(!words.length)return;const it=words[card];$('ci').textContent=card+1;$('ct').textContent=words.length;$('knownText').textContent='已認得 '+known.size+' 個';$('cm').classList.add('hidden');$('cw').textContent='________';$('cs').textContent=mode==='g3'?blankG3(it):blankG6(it);$('cm').textContent=mode==='g3'?it[1]:'';$('cardTools').classList.add('hidden')}
function makeChoices(){const target=words[quiz][0];const pool=[...new Set(words.map(x=>x[0]).filter(w=>w!==target))];shuffle(pool);return shuffle([target,...pool.slice(0,3)])}
function renderQuiz(){if(!words.length)return;answered=false;const it=words[quiz];$('qi').textContent=quiz+1;$('qmsg').textContent='';$('qmsg').className='status';$('qs').textContent=mode==='g3'?blankG3(it):blankG6(it);const box=$('choices');box.innerHTML='';makeChoices().forEach(v=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=v;b.onclick=()=>checkChoice(b,v);box.appendChild(b)})}
function checkChoice(btn,chosen){if(answered)return;answered=true;const target=words[quiz][0];[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===target)b.classList.add('correct')});if(chosen===target){score++;$('score').textContent=score;$('qmsg').textContent='✓ 答對了！';$('qmsg').className='status good'}else{btn.classList.add('wrong');$('qmsg').textContent='答案是：'+target;$('qmsg').className='status bad'}}
tabs.forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
$('reveal').onclick=()=>{const it=words[card];$('cw').textContent=it[0];$('cs').textContent=mode==='g3'?it[2]:it[1];if(mode==='g3')$('cm').classList.remove('hidden');$('cardTools').classList.remove('hidden')};
$('prev').onclick=()=>{card=(card-1+words.length)%words.length;renderCard()};
$('next').onclick=()=>{card=(card+1)%words.length;renderCard()};
$('known').onclick=()=>{known.add(card);card=(card+1)%words.length;renderCard()};
$('hard').onclick=()=>{known.delete(card);card=(card+1)%words.length;renderCard()};
$('show').onclick=()=>{const target=words[quiz][0];answered=true;[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===target)b.classList.add('correct')});$('qmsg').textContent='答案：'+target;$('qmsg').className='status'};
$('qnext').onclick=()=>{quiz=(quiz+1)%words.length;renderQuiz()};
</script>
